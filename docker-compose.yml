services:
  redis:
    image: redis:7-alpine
    container_name: redlin-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  backend:
    build:
      context: ./redlin_web
      dockerfile: Dockerfile
    container_name: redlin-backend
    volumes:
      - ./redlin_web:/app
    ports:
      - "8000:8000"
    env_file:
      - ./redlin_web/.env
    environment:
      TRANSCRIPT_DEBUG: "1"
      TRANSCRIPT_MIN_INTERVAL: "1.2"
      TRANSCRIPT_CLIENT_VARIANTS: "web,android,ios,tv"
    entrypoint: ["sh", "-c", "./entrypoint.sh"]
    depends_on:
      - redis

  worker:
    build:
      context: ./redlin_web
      dockerfile: Dockerfile
    container_name: redlin-worker
    command: ["celery", "-A", "redlin_web", "worker", "-l", "info", "-Q", "default", "--concurrency=1"]
    volumes:
      - ./redlin_web:/app
    env_file:
      - ./redlin_web/.env
    depends_on:
      - redis
      - backend

  beat:
    build:
      context: ./redlin_web
      dockerfile: Dockerfile
    container_name: redlin-beat
    command: ["celery", "-A", "redlin_web", "beat", "-l", "info"]
    volumes:
      - ./redlin_web:/app
    env_file:
      - ./redlin_web/.env
    depends_on:
      - redis
      - backend

  frontend:
    build:
      context: ./redlin-front/redlin-front
      dockerfile: Dockerfile
    container_name: redlin-frontend
    volumes:
      - ./redlin-front/redlin-front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./redlin-front/redlin-front/.env
    depends_on:
      - backend
      - redis