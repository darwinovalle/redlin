services:
  backend:
    build:
      context: ./redlin_web
      dockerfile: Dockerfile
    container_name: redlin-backend
    volumes:
      - ./redlin_web:/app
    ports:
      - "8000:8000"
    env_file:
      - ./redlin_web/.env
    environment:
      TRANSCRIPT_DEBUG: "1"  # habilita logs de depuración de subtitles
      TRANSCRIPT_MIN_INTERVAL: "1.2"  # throttle mínimo entre llamadas yt-dlp (segundos)
      TRANSCRIPT_CLIENT_VARIANTS: "web,android,ios,tv"  # rotación de client variants para reducir 403/DNS
    entrypoint: ["sh", "-c", "./entrypoint.sh"]

  frontend:
    build:
      context: ./redlin-front/redlin-front
      dockerfile: Dockerfile
    container_name: redlin-frontend
    volumes:
      - ./redlin-front/redlin-front:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    env_file:
      - ./redlin-front/redlin-front/.env
    depends_on:
      - backend